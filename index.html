<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <title>FORMULARIOS DA VISTA</title>
</head>
<body>
    <main class="container"> 
        <form>
            <h1>formulario da vista</h1>
            
            <div class="input-box"><!--onde ciamos as caixa para colocar no icono-->
                <input type="text" placeholder="Usuario">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box"><!--e a mesma coisa mas fica onde a senha-->
                <input type="pessword" placeholder="senha">
                <i class="bx bxs-lock-alt"></i>     
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">Lembrar senha
                </label>
                <a href="#">Esquesi a senha</a>
            </div>
            <button type="submit" class="login">Login</button>

            <div class="registre-link">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </main>
</body>
</html>
